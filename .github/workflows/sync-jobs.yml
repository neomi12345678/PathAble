name: Sync jobs

on:
  schedule:
    # 05:00 UTC — לפני cron Vercel; IP של GitHub עוקף חסימת GotFriends + Apify
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: pathable-job-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run job sync
        run: npm run sync:jobs:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SKIP_APIFY: "1"
